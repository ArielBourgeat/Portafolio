<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project Archive - Ariel Bourgeat</title>

<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="projects.css">
</head>

<body id="projects-page">

<div class="custom-cursor"></div>

<header class="archive-top">
    <button type="button" class="menu" id="menuBtn" aria-label="Abrir menú">☰</button>

    <div class="archive-top-right">
        <div class="theme-toggle" role="group" aria-label="Tema">
            <button type="button" class="theme-toggle-btn" data-theme="light">LIGHT</button>
            <span>|</span>
            <button type="button" class="theme-toggle-btn active" data-theme="dark">DARK</button>
        </div>
        <div class="archive-clock" id="projectsClock"></div>
    </div>
</header>

<main id="archiveView">
    <div class="archive-intro" id="archiveIntro">
        <h1>PROJECT ARCHIVE</h1>
        <p>SELECTED WORKS.</p>
        <br>
        <p>Scroll down to see more.</p>
    </div>
    <div class="collage" id="collage"></div>
    <div class="category-nav" id="categoryNav" aria-hidden="true"></div>
</main>

<main id="detailView" hidden>
    <div class="detail-copy" id="detailCopy"></div>
    <div class="detail-stage">
        <div class="detail-scroll" id="detailScroll"></div>
    </div>
    <p class="detail-cat" id="detailCat"></p>
    <div class="detail-map" id="detailMap">
        <div class="detail-map-scale" id="detailMapScale"></div>
        <div class="detail-map-frame" id="detailMapFrame"></div>
    </div>
</main>

<p class="project-mark" id="projectMark"></p>

<div class="menu-overlay" id="menuOverlay">
    <div class="menu-header">
        <button class="menu-close same-spot" onclick="toggleMenu()">✕</button>
        <h1>ARIEL BOURGEAT</h1>
    </div>

    <div class="menu-content">
        <ul class="menu-links">
            <li><a href="index.html" onclick="toggleMenu()">HOME.</a></li>
            <li><a href="About.html" onclick="toggleMenu()">ABOUT.</a></li>
            <li><a href="projects.html" onclick="toggleMenu()">PROJECTS.</a></li>
            <li><a href="contact.html" onclick="toggleMenu()">CONTACT.</a></li>
        </ul>

        <div class="menu-visuals">
            <div class="binary-bg" id="binaryBg">
                <span>0</span><span>1</span><span>1</span><span>0</span><span>1</span><span>0</span>
                <span>1</span><span>0</span><span>0</span><span>1</span><span>1</span><span>0</span>
                <span>0</span><span>1</span><span>1</span><span>0</span><span>1</span><span>0</span>
            </div>
            <div class="menu-character">
                <img src="Images/logo blanco negro.png" alt="Logoblanconegro">
            </div>
        </div>
    </div>

    <div class="menu-footer">
        2026 All Rights Reserved. Ariel Bourgeat
    </div>
</div>

<script src="projects.js"></script>
</body>
</html>
